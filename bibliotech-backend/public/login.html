<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BiblioTech | Iniciar sesión</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f9ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#0b1c30;padding:16px}
  .card{background:#fff;width:100%;max-width:380px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:32px}
  h1{font-size:22px;margin:0 0 4px;color:#004ac6}
  p{margin:0 0 24px;color:#434655;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;height:42px;border:0;border-radius:8px;background:#eff4ff;padding:0 12px;font-size:14px;outline:none}
  input:focus{box-shadow:0 0 0 2px rgba(37,99,235,.3);background:#fff}
  button{width:100%;height:44px;margin-top:22px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:#004ac6}
  button:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:16px;padding:10px 12px;border-radius:8px;background:#ffdad6;color:#93000a;font-size:13px}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>BiblioTech</h1>
  <p>Archivo Central · Inicia sesión para continuar</p>
  <label for="u">Usuario</label>
  <input id="u" name="username" autocomplete="username" required autofocus/>
  <label for="p">Contraseña</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required/>
  <div class="err" id="err" role="alert"></div>
  <button id="b" type="submit">Entrar</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'bibliotech' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');
    location.href = '/';
  } catch (ex) { err.textContent = ex.message; err.style.display = 'block'; b.disabled = false; }
});
</script>
</body>
</html>
